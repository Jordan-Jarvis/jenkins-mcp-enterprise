services:
  # Qdrant Vector Database (optional but recommended for vector search)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jenkins_mcp_enterprise-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped

  # Jenkins MCP Enterprise Server (HTTP mode - no proxy needed)
  jenkins_mcp_enterprise-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Optional: build a vector-enabled image (installs heavy deps) when true.
        # Example:
        #   INSTALL_VECTOR_DEPS=true docker compose up -d --build
        INSTALL_VECTOR_DEPS: ${INSTALL_VECTOR_DEPS:-false}
    container_name: jenkins_mcp_enterprise-server
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=http://qdrant:6333
      - CACHE_DIR=/tmp/mcp-jenkins
      - LOG_LEVEL=INFO
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      # Vector search is disabled by default (keeps installs small and fast).
      # To enable, build with INSTALL_VECTOR_DEPS=true and run with DISABLE_VECTOR_SEARCH=false.
      - DISABLE_VECTOR_SEARCH=${DISABLE_VECTOR_SEARCH:-true}
    volumes:
      - jenkins_mcp_enterprise_cache:/tmp/mcp-jenkins
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  qdrant_data:
    driver: local
  jenkins_mcp_enterprise_cache:
    driver: local

networks:
  default:
    name: jenkins_mcp_enterprise-network